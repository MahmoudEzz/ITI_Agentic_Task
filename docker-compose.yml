services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: domain_copilot
      POSTGRES_PASSWORD: domain_copilot
      POSTGRES_DB: domain_copilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domain_copilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # The ollama image starts an empty server — no models are baked in or pulled
  # automatically. Without this, `docker compose up` looks healthy but every
  # completion/embedding call fails with a "model not found" error that looks
  # like an application bug. This one-shot container pulls the two models the
  # provider adapters expect, then exits; `api` waits for it to succeed.
  # First run downloads ~2-4GB and can take several minutes depending on
  # bandwidth — documented in the README quick-start, not hidden.
  ollama-pull:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "until ollama list >/dev/null 2>&1; do sleep 2; done &&
       ollama pull llama3.2:3b &&
       ollama pull nomic-embed-text"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://domain_copilot:domain_copilot@postgres:5432/domain_copilot
      OLLAMA_HOST: http://ollama:11434
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

volumes:
  pgdata:
  ollama-data:
