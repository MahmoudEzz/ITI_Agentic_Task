name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domain_copilot
          POSTGRES_PASSWORD: domain_copilot
          POSTGRES_DB: domain_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domain_copilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://domain_copilot:domain_copilot@localhost:5432/domain_copilot
      JWT_SECRET: ci-test-secret-not-a-real-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Contract tests
        run: npm run test:contract

      - name: Run migrations
        run: npm run migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true
        timeout-minutes: 2

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
