name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Contract tests (tests/contract) and integration tests (tests/integration, against
      # dockerized Postgres) are added to this job as their respective phases land real
      # tests — see docs/SYSTEM-DESIGN.md phase plan. An empty `node --test` target fails,
      # so wiring these in ahead of real tests would produce a false-red CI, not a stricter one.

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
